name: release

on:
  schedule:
    - cron: "17 3 * * 1"        # every Monday 03:17 UTC: rebuild on the latest Arch Linux ARM
  workflow_dispatch:             # "Run workflow" button: build and release right now
  push:
    branches: [main]
    paths:
      - build.sh
      - config.env
      - keys/**
      - scripts/**
      - rootfs-overlay/**
      - tests/**
      - .github/workflows/release.yml
  pull_request:                    # tests only; build and release are skipped below

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Every action is pinned to a full commit SHA (a tag can be moved, a SHA cannot); the version it
# stands for is in the comment. Dependabot (.github/dependabot.yml) proposes the updates, and
# tests/run.sh fails if an action is ever referenced by tag again.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pacman + fakeroot let the tests ask a real pacman what the NoExtract lines do
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml shellcheck pacman-package-manager fakeroot
      - name: Offline tests
        run: bash tests/run.sh

  # One version for the images and for the release tag: today's date, plus .N when that tag is
  # taken. Worked out once, up front, so /etc/archm-release in an image always matches its tag.
  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(date -u +%Y.%m.%d)
          tag=$base
          n=0
          while gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            n=$((n + 1))
            tag=$base.$n
          done
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version: $tag"

  build:
    needs: [test, version]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ARCHM_VERSION: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            runner: ubuntu-24.04-arm   # native arm64, public repos only
          - abi: arm
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools pigz libtalloc-dev pkg-config
          if [ "${{ matrix.abi }}" = arm ]; then
            sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          fi

      # Ubuntu's apt proot is 5.1.0 (2016): it has neither --link2symlink nor --kill-on-exit
      # (both 5.2.0+), nor faccessat2 (5.4.0+), which a current glibc rootfs relies on.
      # Build the pinned upstream release instead; the SHA check catches a moved tag.
      # The result is cached: bump the "r1" in the key whenever the recipe below changes.
      - name: Cache proot 5.4.0
        id: proot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/archm-proot
          key: proot-5.4.0-bd5a5f6-faccessat2-r1-${{ runner.os }}-${{ runner.arch }}

      - name: Build proot 5.4.0
        if: steps.proot-cache.outputs.cache-hit != 'true'
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch v5.4.0 \
            https://github.com/proot-me/proot.git "$RUNNER_TEMP/proot"
          test "$(git -C "$RUNNER_TEMP/proot" rev-parse HEAD)" = bd5a5f63d72f8210d8cee76195eb9f0749e5bd70
          d="$RUNNER_TEMP/proot/src/syscall"
          sed -i 's/^\(\t\[ 48 \] = PR_faccessat,\)$/\1\n\t[ 439 ] = PR_faccessat2,/' "$d/sysnums-arm64.h"
          sed -i 's/^\(\t\[ 334 \] = PR_faccessat,\)$/\1\n\t[ 439 ] = PR_faccessat2,/' "$d/sysnums-arm.h"
          grep -q PR_faccessat2 "$d/sysnums-arm64.h"
          grep -q PR_faccessat2 "$d/sysnums-arm.h"
          make -C "$RUNNER_TEMP/proot/src" -j"$(nproc)" proot
          install -D -m 0755 "$RUNNER_TEMP/proot/src/proot" "$HOME/.cache/archm-proot/proot"

      - name: Install proot
        run: sudo install -m 0755 "$HOME/.cache/archm-proot/proot" /usr/local/bin/proot

      - name: Build rootfs
        run: sudo env ARCHM_VERSION="$ARCHM_VERSION" bash build.sh "${{ matrix.abi }}" dist

      # Package sizes, file count, hardlink cost: the numbers for deciding what to trim next.
      - name: Build report
        run: |
          f="dist/archm-${{ matrix.abi }}.stats.md"
          if [ -f "$f" ]; then cat "$f" >>"$GITHUB_STEP_SUMMARY"; fi

      # Runs as the normal runner user, like an Android app. It gates the release: a failure
      # stops this job, so the release job never runs and no broken image is published.
      - name: Smoke test under proot
        run: bash scripts/smoke-proot.sh "dist/archm-${{ matrix.abi }}.tar.gz" "${{ matrix.abi }}"

      # Also after a failed smoke test, so the image that failed can be downloaded and examined.
      # It is already compressed: store it as is instead of deflating it a second time.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && hashFiles('dist/archm-*.tar.gz') != '' }}
        with:
          name: archm-${{ matrix.abi }}
          path: dist/archm-${{ matrix.abi }}.*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Publishing happens only from main (a manual run on some branch must not become "latest").
  release:
    needs: [version, build]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write           # create the release and its tag
      id-token: write           # sign the provenance attestation (Sigstore)
      attestations: write       # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archm-*
          merge-multiple: true
          path: dist

      # Verifiable with: gh attestation verify archm-arm64.tar.gz --repo <owner>/archm
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/archm-*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_RELEASES: ${{ vars.KEEP_RELEASES }}     # optional repo variable, e.g. 12
          ARCHM_VERSION: ${{ needs.version.outputs.tag }}
        run: bash scripts/publish.sh dist
