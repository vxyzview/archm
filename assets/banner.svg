    <g font-size="17" fill="#CFEBFA" text-anchor="middle">
      <rect x="64"  y="270" width="92"  height="36" rx="18" fill="#1793D1" fill-opacity="0.18" stroke="#1793D1" stroke-opacity="0.6"/>
      <text x="110" y="293">arm64</text>
      <rect x="170" y="270" width="92"  height="36" rx="18" fill="#1793D1" fill-opacity="0.18" stroke="#1793D1" stroke-opacity="0.6"/>
      <text x="216" y="293">armv7</text>
      <rect x="276" y="270" width="104" height="36" rx="18" fill="#1793D1" fill-opacity="0.18" stroke="#1793D1" stroke-opacity="0.6"/>
      <text x="328" y="293">signed</text>
      <rect x="394" y="270" width="104" height="36" rx="18" fill="#1793D1" fill-opacity="0.18" stroke="#1793D1" stroke-opacity="0.6"/>
      <text x="446" y="293">weekly</text>
    </g>
  </g>
  <text x="64" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="25" fill="#C9D6E8">A slim, signed, weekly-fresh rootfs for proot.</text>

  <!-- right: a terminal window -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="16">
