    <circle cx="810" cy="78" r="6" fill="#28C840"/>
    <text x="1202" y="83" text-anchor="end" font-size="13" fill="#7F8EA6">root@archm</text>

    <text x="762" y="132" fill="#E6EDF7"><tspan fill="#4ADE80" font-weight="700">root</tspan>@<tspan fill="#22D3EE" font-weight="700">archm</tspan>:<tspan fill="#60A5FA" font-weight="700">~</tspan># pacman -Syu</text>
    <text x="762" y="164" fill="#7F8EA6">:: Synchronizing package databases...</text>
    <text x="762" y="190" fill="#7F8EA6">:: Starting full system upgrade...</text>
    <text x="762" y="216" fill="#7F8EA6">there is nothing to do</text>
    <text x="762" y="252" fill="#E6EDF7"><tspan fill="#4ADE80" font-weight="700">root</tspan>@<tspan fill="#22D3EE" font-weight="700">archm</tspan>:<tspan fill="#60A5FA" font-weight="700">~</tspan># <tspan fill="#1793D1">█</tspan></text>
  </g>
