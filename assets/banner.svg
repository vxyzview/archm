<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">archm: Arch Linux ARM for proot on Android</title>
  <desc id="d">A terminal-style banner: the name archm with a block cursor, the line "a slim, signed, weekly-fresh rootfs for proot", and a small terminal window running pacman -Syu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="0.6" stop-color="#0D1B34"/>
      <stop offset="1" stop-color="#0F2A4D"/>
    </linearGradient>
    <radialGradient id="glow" cx="1010" cy="40" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1793D1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1793D1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="451" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#6CC4F0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1793D1"/>
      <stop offset="1" stop-color="#1793D1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="340" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <rect x="64" y="42" width="150" height="4" rx="2" fill="url(#bar)"/>
  </g>
  <rect x="1" y="1" width="1278" height="338" rx="25" fill="none" stroke="#1793D1" stroke-opacity="0.35" stroke-width="2"/>

  <!-- left: name, tagline, pills -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">
    <text x="64" y="82" font-size="16" letter-spacing="3" fill="#6CC4F0">ARCH LINUX ARM  ·  PROOT  ·  ANDROID</text>
